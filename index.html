<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1d1b19">
<title>Аудиокниги</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="library">
  <h1>Мои книги</h1>
  <label class="btn primary add">
    + Добавить книгу
    <input id="file" type="file" accept=".pdf,.epub,.txt,application/pdf,application/epub+zip,text/plain" hidden>
  </label>
  <p class="hint">PDF, EPUB или TXT · русский и румынский</p>
  <ul id="books"></ul>
</main>

<main id="player" hidden>
  <button id="back" class="link">← Книги</button>
  <h2 id="title"></h2>
  <p id="part" class="muted"></p>
  <input id="seek" type="range" min="0" value="0" step="1">

  <div class="controls">
    <button id="prev" aria-label="Предыдущая часть">⏮</button>
    <button id="rew" aria-label="Назад 15 секунд">−15</button>
    <button id="play" class="big" aria-label="Играть">▶</button>
    <button id="fwd" aria-label="Вперёд 30 секунд">+30</button>
    <button id="next" aria-label="Следующая часть">⏭</button>
  </div>

  <div class="row">
    <label>Голос <select id="voice"></select></label>
    <label>Скорость <select id="rate">
      <option>0.9</option><option selected>1</option><option>1.15</option>
      <option>1.3</option><option>1.5</option><option>1.75</option><option>2</option>
    </select></label>
  </div>

  <button id="download" class="btn">Скачать всю книгу для офлайн</button>
  <progress id="dlbar" max="1" value="0" hidden></progress>
  <p id="status" class="muted" role="status"></p>
  <p id="text" class="text"></p>
  <button id="delete" class="link danger">Удалить книгу</button>
</main>

<audio id="audio" preload="auto"></audio>
<script type="module" src="app.js"></script>
</body>
</html>
